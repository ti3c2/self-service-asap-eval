[project]
name = "self-service-asap-eval"
version = "0.1.0"
description = "Evaluation scaffold for the RAG+ASAP self-service component"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ragas==0.3.2",
    "fastmcp==2.14.1",
    "httpx>=0.27.0,<1.0.0",
    "langchain-openai>=0.3.0,<1.0.0",
    "pandas>=2.2.0,<3.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "tomli>=2.0.0,<3.0.0; python_version < '3.11'",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "ruff>=0.8.0,<1.0.0",
]

[project.scripts]
asap-eval = "asap_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asap_eval"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
